<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Taller{% endblock %}</title>
  <!-- Bootstrap's own styles: Taller's pages carry no brand of their own, and
       never the owner's (a brand belongs to her projects, not to the tool). -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  {% block head %}{% endblock %}
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('cockpit.board') }}">Taller</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('cockpit.board') }}">Tickets</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('cockpit.spend') }}">Spend</a></li>
    </ul>
    <span class="navbar-text small">on this machine only</span>
  </div>
</nav>
<main class="container-fluid py-3">
  {% if problem %}<div class="alert alert-warning">{{ problem }}</div>{% endif %}
  {% for message in get_flashed_messages() %}
  <div class="alert alert-warning">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<!-- Every form carries this, and every write checks it: a page on another site
     must not be able to make this one act. -->
<form hidden><input type="hidden" name="{{ token_field }}" value="{{ token() }}"></form>
</body>
</html>
